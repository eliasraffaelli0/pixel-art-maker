<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Maker</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>¡Dibuja tu pixel art! </h1>
    <button id="random-button">Color Random!</button>
    <button class="color-button">
        <label for="colorpicker">Color Picker:</label>
        <input type="color" id="colorpicker" value="#0000ff">
    </button>
    <button id="eraser-button">Borrar</button>
    <button id="grid-lines-button">Grilla</button>
    <button id="shade-button">Sombrear</button>
    <button id="lighten-button">Aclarar</button>
    <div class="container">
        <div id="color-history"></div>
        <div id="grid-container"></div>
    </div>
    <button id="clear-button">Limpiar tabla</button>
    <button id="change-button">Cambiar tamaño</button>
    <button id="undo-button">Deshacer</button>
    <button id="redo-button">Rehacer</button>

</body>
<script src="./script.js"></script>
</html>
